# cargo-deny: license, advisory, ban and source checks for every dependency (plan §7).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Build-time proc macro pulled in by Tauri's Linux GTK stack (glib-macros 0.18); no fix until Tauri moves to gtk4.
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk 0.18, build-time only" },
  # Not vulnerabilities: these crates were folded into zbus 6. tauri-plugin-opener (Linux D-Bus)
  # is still on zbus 5; drop these once it upgrades.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; via tauri-plugin-opener" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; via tauri-plugin-opener" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; via tauri-plugin-opener" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses compatible with shipping Boxdeck under MIT.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "CC0-1.0",
  # File-level copyleft from Tauri's HTML parsing deps (cssparser, selectors); fine unmodified in an MIT app.
  "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace path dependencies have no version, which `wildcards` would otherwise flag.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one git dependency the plan allows (§3.3); pinned by `rev` when added in M1a.
allow-git = ["https://github.com/tauri-apps/fix-path-env-rs"]
