name: CI

# The site is deployed by pages.yml and has nothing for CI to check.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**"]
  pull_request:
    paths-ignore: ["site/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Restores the .deb files instead of downloading WebKitGTK and friends on every run.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: tauri-v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Pull requests restore main's cache but never save their own, so they can't evict it.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tauri-build needs the bundled boxdeck-mcp to exist, even for clippy and tests.
      - name: Build the MCP sidecar
        run: npm run sidecar

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Frontend checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test

      - name: Debug app build
        run: npm run tauri build -- --debug --no-bundle
