name: Bug report
description: Something in Boxdeck doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Boxdeck
        2. Click ...
    validations:
      required: true
  - type: input
    id: boxdeck-version
    attributes:
      label: Boxdeck version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 15.4, Windows 11 24H2, Ubuntu 24.04 ...
    validations:
      required: true
  - type: input
    id: vagrant-version
    attributes:
      label: Vagrant version and provider
      placeholder: Vagrant 2.4.9, vmware_desktop
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from the Activity view or the log file. Remove any paths or names you don't want to share.
      render: text
